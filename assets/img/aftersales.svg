<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.55"/>
  <!-- Top status strip -->
  <rect x="48" y="42" width="864" height="44" rx="10" fill="#0F172A" stroke="#24344D"/>
  <circle cx="74" cy="64" r="5" fill="#34D399"/>
  <text x="90" y="69" fill="#CBD5E1" font-family="monospace" font-size="14">AFTERSALES COPILOT · DEEP RAG + LANGGRAPH RBAC</text>
  <rect x="768" y="53" width="126" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="831" y="68" fill="#6EE7B7" font-family="monospace" font-size="11" text-anchor="middle">SSE STREAM LIVE</text>

  <!-- Node Graph -->
  <!-- Node 1: Query & Slot -->
  <rect x="56" y="148" width="190" height="104" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="74" y="176" fill="#38BDF8" font-family="monospace" font-size="11">01 · INTENT &amp; SLOT</text>
  <text x="74" y="203" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="600">缺型号精准拦截</text>
  <text x="74" y="228" fill="#94A3B8" font-family="monospace" font-size="12">SN / Model_ID 识别</text>

  <!-- Connector 1-2 -->
  <path d="M 246 200 L 298 200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="298,195 308,200 298,205" fill="#34D399"/>

  <!-- Node 2: Hybrid RAG -->
  <rect x="312" y="132" width="240" height="136" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="330" y="160" fill="#34D399" font-family="monospace" font-size="11">02 · DEEP HYBRID RAG</text>
  <text x="330" y="187" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="600">Qdrant + BM25 + Rerank</text>
  <rect x="330" y="202" width="96" height="24" rx="6" fill="#1E293B"/>
  <text x="378" y="218" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">BGE-ONNX</text>
  <rect x="434" y="202" width="100" height="24" rx="6" fill="#1E293B"/>
  <text x="484" y="218" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">Parent-Child</text>
  <text x="330" y="250" fill="#94A3B8" font-family="monospace" font-size="11">严格 model_id 隔离防跨机型幻觉</text>

  <!-- Connector 2-3 -->
  <path d="M 552 200 L 604 200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="604,195 614,200 604,205" fill="#34D399"/>

  <!-- Node 3: MCP + HITL -->
  <rect x="618" y="148" width="286" height="104" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="636" y="176" fill="#FBBF24" font-family="monospace" font-size="11">03 · MCP TOOLS &amp; RBAC</text>
  <text x="636" y="203" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="600">质保 / 库存查询 · 主管审批</text>
  <text x="636" y="228" fill="#94A3B8" font-family="monospace" font-size="12">LangGraph Human-in-the-Loop</text>

  <!-- Bottom Telemetry Panel -->
  <rect x="56" y="316" width="848" height="168" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="#1E293B"/>
  <text x="80" y="352" fill="#94A3B8" font-family="monospace" font-size="12">EVALUATION &amp; WORKSPACE CAPABILITIES</text>
  <line x1="80" y1="368" x2="880" y2="368" stroke="#1E293B"/>

  <text x="80" y="408" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="700">7 Nodes</text>
  <text x="80" y="434" fill="#94A3B8" font-family="sans-serif" font-size="13">LangGraph 状态机编排</text>

  <text x="300" y="408" fill="#34D399" font-family="monospace" font-size="28" font-weight="700">RRF + LLM</text>
  <text x="300" y="434" fill="#94A3B8" font-family="sans-serif" font-size="13">双路召回与精排溯源角标</text>

  <text x="560" y="408" fill="#FBBF24" font-family="monospace" font-size="28" font-weight="700">MCP 2.x</text>
  <text x="560" y="434" fill="#94A3B8" font-family="sans-serif" font-size="13">工单 / 备件 / 质保工具链</text>

  <text x="760" y="408" fill="#E2E8F0" font-family="monospace" font-size="28" font-weight="700">RBAC</text>
  <text x="760" y="434" fill="#94A3B8" font-family="sans-serif" font-size="13">工程师 ↔ 主管双视角</text>
</svg>
